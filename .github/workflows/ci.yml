name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly run catches breakage from new dependency releases and advisories.
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.parity-upload.outputs.artifact-id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, fileinfo, json
          coverage: xdebug

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache
            vendor
          key: composer-php-8.4-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-php-8.4-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Validate dependencies
        run: |
          composer validate --strict
          composer audit --locked --no-interaction

      - name: Run Pint
        run: ./vendor/bin/pint --test

      - name: Run Pest
        run: XDEBUG_MODE=coverage ./vendor/bin/pest --coverage-xml=coverage-xml --coverage-clover=clover.xml --colors=never

      - name: Run Parity on Parity
        run: |
          markdown_status=0
          php parity check --format=github > parity-comment.md || markdown_status=$?
          php parity check --format=json > parity-results.json
          exit "$markdown_status"

      - name: Upload Parity results
        id: parity-upload
        if: ${{ always() && hashFiles('parity-results.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: parity-results
          path: |
            parity-results.json
            parity-comment.md
          retention-days: 30

      - name: Build PHAR
        run: |
          mkdir -p vendor/humbug/php-scoper/vendor-hotfix
          echo "<?php // vendor-hotfix placeholder" > vendor/humbug/php-scoper/vendor-hotfix/placeholder.php
          ./vendor/bin/box compile --no-interaction
        env:
          BOX_CACHE_ENABLED: false

      - name: Verify PHAR
        if: runner.os == 'Linux'
        run: |
          chmod +x parity.phar
          test "$(./parity.phar --version)" = "Parity $(cat VERSION)"
          ./parity.phar check --format=json

  parity-comment:
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.ci.outputs.artifact-id != '' }}
    needs: ci
    permissions:
      pull-requests: write
    uses: ./.github/workflows/parity-comment.yml
    with:
      artifact-name: parity-results
      report-path: parity-comment.md
