name: Release smoke

on:
  workflow_call:
    inputs:
      version:
        description: Optional tagged version to wait for on Packagist before installing.
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Optional tagged version to install from Packagist, for example v1.2.3.
        required: false
        type: string
  schedule:
    - cron: '17 8 * * 1'

jobs:
  public-install:
    name: Public Packagist install
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, json
          coverage: none

      - name: Resolve target version
        id: target
        env:
          CALLED_VERSION: ${{ inputs.version }}
          DISPATCHED_VERSION: ${{ github.event.inputs.version }}
        run: |
          TARGET_VERSION="$CALLED_VERSION"
          if [ -z "$TARGET_VERSION" ]; then
            TARGET_VERSION="$DISPATCHED_VERSION"
          fi

          if [ -n "$TARGET_VERSION" ] && [[ ! "$TARGET_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Target version must use vMAJOR.MINOR.PATCH format" >&2
            exit 1
          fi

          echo "value=$TARGET_VERSION" >> "$GITHUB_OUTPUT"

      - name: Wait for Packagist package
        if: ${{ steps.target.outputs.value != '' }}
        env:
          TARGET_VERSION: ${{ steps.target.outputs.value }}
        run: |
          NORMALIZED_VERSION="${TARGET_VERSION#v}"

          for attempt in $(seq 1 30); do
            if php -r '
              $target = $argv[1];
              $json = @file_get_contents("https://repo.packagist.org/p2/testparity/parity.json");
              if ($json === false) {
                  exit(1);
              }

              $payload = json_decode($json, true);
              foreach ($payload["packages"]["testparity/parity"] ?? [] as $package) {
                  $version = ltrim((string) ($package["version"] ?? ""), "v");
                  if ($version === $target) {
                      exit(0);
                  }
              }

              exit(1);
            ' "$NORMALIZED_VERSION"; then
              echo "Packagist has version $TARGET_VERSION"
              exit 0
            fi

            echo "Packagist does not have $TARGET_VERSION yet (attempt $attempt/30); retrying in 20 seconds"
            sleep 20
          done

          echo "Timed out waiting for Packagist version $TARGET_VERSION" >&2
          exit 1

      - name: Install Parity from Packagist
        env:
          TARGET_VERSION: ${{ steps.target.outputs.value }}
        run: |
          if [ -n "$TARGET_VERSION" ]; then
            composer global require "testparity/parity:${TARGET_VERSION}" --prefer-dist --no-progress --no-interaction
          else
            composer global require testparity/parity --prefer-dist --no-progress --no-interaction
          fi
          composer global config bin-dir --absolute >> "$GITHUB_PATH"

      - name: Build temporary sample project
        run: bash "$GITHUB_WORKSPACE/dev/build-release-smoke-project.sh" /tmp/parity-smoke

      - name: Run installed Parity
        working-directory: /tmp/parity-smoke
        env:
          TARGET_VERSION: ${{ steps.target.outputs.value }}
        run: |
          INSTALLED_VERSION="$(parity --version)"
          INSTALLED_TAG="${INSTALLED_VERSION#Parity }"
          if [[ ! "$INSTALLED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Installed Parity returned an invalid version: $INSTALLED_VERSION" >&2
            exit 1
          fi
          if [ -n "$TARGET_VERSION" ] && [ "$INSTALLED_VERSION" != "Parity $TARGET_VERSION" ]; then
            echo "Installed version mismatch: expected Parity $TARGET_VERSION, got $INSTALLED_VERSION" >&2
            exit 1
          fi
          echo "$INSTALLED_VERSION"
          parity check --format=json

          # Recurring latest-stable checks bridge the pre-v1.2.0 package; exact
          # tagged release checks never skip the parity test gate.
          if [ -z "$TARGET_VERSION" ] && ! php -r '
            exit(version_compare(ltrim($argv[1], "v"), "1.2.0", ">=") ? 0 : 1);
          ' "$INSTALLED_TAG"; then
            echo "Latest stable predates parity test; check-only smoke completed."
            exit 0
          fi

          parity test --format=json
          test -f .parity/per-test/index.json
